<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body onload="setDefault()">
    <!-- <h1>Hello World</h1>   -->
    <select name="" id="kick" onchange="setInstrument(this.value,'kick')">
      <option value="audio-samples/a-real-freakin-drum-kit/kick/kick.mp3" selected>kick 1</option>
      <option value="audio-samples/a-real-freakin-drum-kit/kick/176[kb]real-kick-F001.wav.mp3">kick 2</option>
      <option value="audio-samples/a-real-freakin-drum-kit/kick/176[kb]real-kick-F003.wav.mp3">kick 3</option>
      <option value="audio-samples/a-real-freakin-drum-kit/kick/169[kb]real-kick-F004.wav.mp3">kick 4</option>
      <option value="audio-samples/a-real-freakin-drum-kit/kick/169[kb]real-kick-F005.wav.mp3">kick 5</option>
      <option value="audio-samples/a-real-freakin-drum-kit/kick/95[kb]real-kick-F009.wav.mp3">kick 6</option>
      <option value="audio-samples/a-real-freakin-drum-kit/kick/162[kb]real-kick-F011.wav.mp3">kick 7</option>
      <option value="audio-samples/a-real-freakin-drum-kit/kick/162[kb]real-kick-F012.wav.mp3">kick 8</option>
    </select>

    <select name="" id="snare" onchange="setInstrument(this.value,'snare')">
      <option value="audio-samples/a-real-freakin-drum-kit/snare/snare.mp3" selected>snare 1</option>
      <option value="audio-samples/a-real-freakin-drum-kit/snare/74[kb]real-01RI-snare-R4.M.wav.mp3">snare 2</option>
      <option value="audio-samples/a-real-freakin-drum-kit/snare/88[kb]real-01BB1-snare-R2M.wav.mp3">snare 3</option>
      <option value="audio-samples/a-real-freakin-drum-kit/snare/98[kb]real-01BB1-snare-R4M.wav.mp3">snare 4</option>
      <option value="audio-samples/a-real-freakin-drum-kit/snare/110[kb]real-01RR-snare-R1M.wav.mp3">snare 5</option>
      <option value="audio-samples/a-real-freakin-drum-kit/snare/113[kb]real-01LR-snare-R2C-R.wav.mp3">snare 6</option>
      <option value="audio-samples/a-real-freakin-drum-kit/snare/137[kb]real-01RR-snare-R2A-R.wav.mp3">snare 7</option>
      <option value="audio-samples/a-real-freakin-drum-kit/snare/143[kb]real-01RR-snare-R1C-L.wav.mp3">snare 8</option>
    </select>

    <select name="" id="hihat" onchange="setInstrument(this.value,'hihat')">
      <option value="audio-samples/a-real-freakin-drum-kit/hihat-muted/hihat.mp3" selected>hi hat 1</option>
      <option value="audio-samples/a-real-freakin-drum-kit/hihat-muted/51[kb]real-01PD.UF-HiHat-M.wav.mp3">hi hat 2</option>
      <option value="audio-samples/a-real-freakin-drum-kit/hihat-muted/71[kb]real-03PD.UF-HiHat-A-L.wav.mp3">hi hat 3</option>
      <option value="audio-samples/a-real-freakin-drum-kit/hihat-muted/84[kb]real-01L2.UF-HiHat-M.wav.mp3">hi hat 4</option>
      <option value="audio-samples/a-real-freakin-drum-kit/hihat-muted/85[kb]real-02R3.UF-HiHat-M.wav.mp3">hi hat 5</option>
      <option value="audio-samples/a-real-freakin-drum-kit/hihat-muted/86[kb]real-01L3.UF-HiHat-A-L.wav.mp3">hi hat 6</option>
      <option value="audio-samples/a-real-freakin-drum-kit/hihat-muted/98[kb]real-02L4.UF-HiHat-A-R.wav.mp3">hi hat 7</option>
      <option value="audio-samples/a-real-freakin-drum-kit/hihat-muted/98[kb]real-02R3.UF-HiHat-A-L.wav.mp3">hi hat 8</option>
      <option value="audio-samples/a-real-freakin-drum-kit/hihat-muted/98[kb]real-02R3.UF-HiHat-A-L.wav.mp3">hi hat 9</option>
      <option value="audio-samples/a-real-freakin-drum-kit/hihat-muted/107[kb]real-02R4.UF-HiHat-A-L.wav.mp3">hi hat 10</option>
      <option value="audio-samples/a-real-freakin-drum-kit/hihat-muted/137[kb]real-01RR-snare-R2A-R.wav.mp3">hi hat 11</option>
    </select>



    <script>
      // initialize parts of drums
      const Instrument = {
        Kick: "kick",
        Snare: "snare",
        Hihat: "hihat",
        HihatOpen: "hihatOpen"
      }
      //initialize audio sources
      let kick, snare, hihat, hihatOpen;

      // initialize audio elements
      let kickBassAudioElement, snareAudioElement, hiHatClosedAudioElement, hiHatOpenAudioElement;

      //setting default values
      function setDefault() {
        console.log("setDefault called");
      kick = "audio-samples/a-real-freakin-drum-kit/kick/kick.mp3";
       snare = "audio-samples/a-real-freakin-drum-kit/snare/snare.mp3";
       hihat = "audio-samples/a-real-freakin-drum-kit/hihat-muted/hihat.mp3";
       hihatOpen = "audio-samples/a-real-freakin-drum-kit/hihat-open/554[kb]real-01PS.UF-HiHat-M.wav.mp3";
      }
       
      
      function setInstrument(source, element) {
        switch (element) {
          case Instrument.Kick:
            kick = source;
            break;
          case Instrument.Snare:
            snare = source;
            break;
          case Instrument.Hihat:
            hihat = source;
            break;
          case Instrument.HihatOpen:
          hihatOpen = source;
            break;
        }
      }
      
      // function play(instrumentId) {
      //   var audio = document.getElementById(instrumentId);
      //   audio.play();
      // }

      // function stop(instrumentId) {
      //   var audio = document.getElementById(instrumentId);
      //   audio.pause();
      //   audio.currentTime = 0;
      // }

      document.addEventListener("keydown", function (e) {
        if (e.keyCode == 90) {
          // kickBassAudioElement.volume = 0.1;
          kickBassAudioElement = new Audio(kick);
          kickBassAudioElement.play(); 
        }
        if (e.keyCode == 83 || e.keyCode == 65) {
          snareAudioElement = new Audio(snare);
          snareAudioElement.play();
        }
        if (e.keyCode == 82 || e.keyCode == 69) {
          hiHatClosedAudioElement = new Audio(hihat);
          hiHatClosedAudioElement.play();
          if (hiHatOpenAudioElement) {
            hiHatOpenAudioElement.pause();
            hiHatOpenAudioElement.addEventListener("ended", function(){ 
              hiHatOpenAudioElement.destroy();
});
          }
        }
        if (e.keyCode == 84) {
          hiHatOpenAudioElement = new Audio(hihatOpen);
            hiHatOpenAudioElement.play(); 
        }
      });
    </script>
  </body>
</html>
